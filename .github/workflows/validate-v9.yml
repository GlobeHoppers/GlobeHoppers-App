name: Validate GlobeHoppers v9 (No Deploy)

on:
  push:
    branches:
      - refactor/v9-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-v9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: WP0–WP4 data, playback, viewer and editor regression build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: journeylines
    steps:
      - name: Checkout v9 branch
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: journeylines/package-lock.json
      - name: Verify frozen travel data and referential integrity
        run: node scripts/verify-v9-baseline.mjs .
      - name: Install reproducibly from lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify original v7.5.15 features
        run: npm run verify:v7.5.15
      - name: Unit-test deterministic playback plans and dateline handling
        run: node --test scripts/test-v9-playback.mjs
      - name: Compare v9 trajectories against legacy routing worker
        run: node scripts/test-v9-worker-parity.mjs
      - name: Test v9 lazy playback loader and stale-data fallback
        run: node --test scripts/test-v9-playback-library.mjs
      - name: Unit-test authoritative playback clock and cancellation
        run: node --test scripts/test-v9-playback-clock.mjs
      - name: Unit-test timeline transitions and connected legs
        run: node --test scripts/test-v9-playback-transitions.mjs
      - name: Unit-test camera arbitration and time-based smoothing
        run: node --test scripts/test-v9-camera-director.mjs
      - name: Test WP3 frame scheduler, 60Hz display and subsystems
        run: node --test scripts/test-v9-renderer-pipeline.mjs
      - name: Test GPU pixel/render budgets without changing legacy mode
        run: node --test scripts/test-v9-map-render-budget.mjs
      - name: Verify disabled metrics and distinct playback/renderer FPS samples
        run: node --test scripts/test-v9-performance-diagnostics.mjs
      - name: Test verified lazy viewer data and Studio isolation
        run: node --test scripts/test-v9-viewer-store.mjs
      - name: Compile trips into Vite public assets (v9 preview only)
        run: node scripts/compile-v9-playback.mjs --out public/data/v9-playback
      - name: Verify all compiled trips and playback plans
        run: node scripts/verify-v9-playback.mjs public/data/v9-playback
      - name: Build original viewer without publishing
        run: npm run build
      - name: Assert original viewer build output exists
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/data/v9-playback/manifest.json
          test -f dist/data/v9-viewer/manifest.json
          node scripts/verify-v9-playback.mjs dist/data/v9-playback
          node scripts/verify-v9-viewer-data.mjs dist/data/v9-viewer
          echo "WP0–WP3 engine, camera, renderer and compiler validated; no production deploy"
      - name: Upload isolated v9 preview build
        uses: actions/upload-artifact@v4
        with:
          name: GlobeHoppers-v9-WP4-preview
          path: journeylines/dist/
          if-no-files-found: error
          retention-days: 7
